spring.application.name=ecommerce-app
server.port=8080

# ---- PostgreSQL ----
# Values below fall back to local defaults, but can be overridden with
# environment variables (recommended for production / Render / any host):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yourpassword}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT (secret Railway variable JWT_SECRET se aata hai)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Admin login (password from Railway variable ADMIN_PASSWORD)
app.admin.password=${ADMIN_PASSWORD:}

# Online payment ke turant baad order confirm + Qikink push (false = admin manually confirm kare)
app.auto-confirm-paid-orders=${AUTO_CONFIRM_PAID_ORDERS:true}

# Qikink sandbox test design (only used when QIKINK_SANDBOX_MODE=true)
qikink.design-code=${QIKINK_DESIGN_CODE:SHOPEASE-TEST}
qikink.design-link=${QIKINK_DESIGN_LINK:}
qikink.mockup-link=${QIKINK_MOCKUP_LINK:}
qikink.design-width-inches=${QIKINK_DESIGN_WIDTH_INCHES:10}
qikink.design-height-inches=${QIKINK_DESIGN_HEIGHT_INCHES:10}
qikink.placement-sku=${QIKINK_PLACEMENT_SKU:fr}
